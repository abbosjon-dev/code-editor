name: CI

on:
  push:
    branches: ["main", "claude/**"]
  pull_request:
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    name: ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Install Linux system libraries
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libxkbcommon-dev libgl1-mesa-dev libwayland-dev libx11-dev
      - name: Test
        run: cargo test --workspace
      - name: Install packaging tools
        shell: bash
        run: |
          if [ "$RUNNER_OS" = Linux ]; then
            curl -fsSL -o "$RUNNER_TEMP/appimagetool" https://github.com/AppImage/appimagetool/releases/download/continuous/appimagetool-x86_64.AppImage
            chmod +x "$RUNNER_TEMP/appimagetool"
            echo "APPIMAGETOOL=$RUNNER_TEMP/appimagetool" >> "$GITHUB_ENV"
          elif [ "$RUNNER_OS" = Windows ]; then
            dotnet tool install --global wix --version 5.0.2
          fi
      - name: Build packages
        shell: bash
        run: bash packaging/package.sh
      - name: Upload packages
        uses: actions/upload-artifact@v4
        with:
          name: zenith-${{ runner.os }}
          path: dist/*
