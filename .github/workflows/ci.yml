name: CI

on:
  push:
    branches: ["main", "claude/**"]
  pull_request:
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    name: ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Install Linux system libraries
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libxkbcommon-dev libgl1-mesa-dev libwayland-dev libx11-dev
      - name: Test
        run: cargo test --workspace
      - name: Build release
        run: cargo build --release -p zenith-app
      - name: Upload binary
        uses: actions/upload-artifact@v4
        with:
          name: zenith-${{ runner.os }}
          path: |
            target/release/zenith
            target/release/zenith.exe
          if-no-files-found: ignore
