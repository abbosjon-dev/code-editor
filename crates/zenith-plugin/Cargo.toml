[package]
name = "zenith-plugin"
description = "Out-of-process plugin host for the Zenith editor (JSON lines over stdio)"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
zenith-core.workspace = true
serde.workspace = true
serde_json.workspace = true
toml.workspace = true
anyhow.workspace = true
log.workspace = true
wasmtime = { version = "46", optional = true, default-features = false, features = ["cranelift", "runtime", "std", "parallel-compilation"] }
async-trait = { version = "0.1", optional = true }
wasi-common = { version = "46", optional = true, default-features = false, features = ["sync", "wasmtime"] }

[features]
default = ["wasm"]
# WebAssembly (WASI) plugins, run sandboxed in-process with wasmtime.
wasm = ["dep:wasmtime", "dep:wasi-common", "dep:async-trait"]
