[package]
name = "zenith-app"
description = "Zenith — a fast, extensible, AI-native code editor"
version.workspace = true
edition.workspace = true
license.workspace = true
default-run = "zenith"

[[bin]]
name = "zenith"
path = "src/main.rs"

[dependencies]
zenith-core.workspace = true
zenith-terminal.workspace = true
zenith-plugin.workspace = true
zenith-ai.workspace = true
zenith-lsp.workspace = true
zenith-dap.workspace = true
serde.workspace = true
serde_json.workspace = true
toml.workspace = true
anyhow.workspace = true
log.workspace = true

eframe = { version = "0.31.1", default-features = false, features = ["accesskit", "default_fonts", "glow", "wayland", "x11"] }
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "gif", "webp"] }
egui_extras = { version = "0.31.1", default-features = false, features = ["image", "file"] }
syntect = { version = "5.3", default-features = false, features = ["parsing", "regex-onig"] }
two-face = { version = "0.5", default-features = false, features = ["syntect-onig"] }
rfd = "0.18"
ignore = "0.4"
which.workspace = true
nucleo-matcher = "0.3"
directories = "6"
unicode-width = "0.2"
similar = "2"
regex = "1"
egui_commonmark = { version = "0.20", default-features = false, features = ["pulldown_cmark", "load-images"] }
env_logger = "0.11"
tree-sitter = "0.25"
streaming-iterator = "0.1.9"
tree-sitter-rust = "0.24.2"
tree-sitter-python = "0.25.0"
tree-sitter-javascript = "0.25.0"
tree-sitter-typescript = "0.23.2"
tree-sitter-go = "0.25.0"
tree-sitter-c = "0.24.2"
tree-sitter-cpp = "0.23.4"
tree-sitter-json = "0.24.8"
tree-sitter-bash = "0.25.1"
tree-sitter-html = "0.23.2"
tree-sitter-css = "0.25.0"
sha2 = "0.10"
qrcode = { version = "0.15", default-features = false }

# Embedded web preview: the system WebView (WKWebView / WebView2) on macOS
# and Windows; on Linux WebKitGTK, opt-in with `--features webview`
# (needs libwebkit2gtk-4.1-dev to build).
[target.'cfg(any(target_os = "macos", target_os = "windows"))'.dependencies]
wry = "0.58"

[target.'cfg(target_os = "linux")'.dependencies]
wry = { version = "0.58", optional = true }
gtk = { version = "0.19", optional = true }

[features]
webview = ["dep:wry", "dep:gtk"]

[target.'cfg(windows)'.build-dependencies]
winresource = "0.1"
