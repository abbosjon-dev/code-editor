[workspace]
resolver = "2"
members = ["crates/*"]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"
repository = "https://github.com/abbosjon-dev/code-editor"

[workspace.dependencies]
zenith-core = { path = "crates/zenith-core" }
zenith-terminal = { path = "crates/zenith-terminal" }
zenith-plugin = { path = "crates/zenith-plugin" }
zenith-ai = { path = "crates/zenith-ai" }
zenith-lsp = { path = "crates/zenith-lsp" }
zenith-dap = { path = "crates/zenith-dap" }
ropey = "1.6"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
regex = "1"
toml = "0.8"
anyhow = "1"
log = "0.4"
which = "7"

[profile.release]
lto = "thin"
codegen-units = 1
opt-level = 3
strip = true

[profile.dev.package."*"]
opt-level = 2
